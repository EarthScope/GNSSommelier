id: COD
name: Center for Orbit Determination in Europe (AIUB)
website: https://www.aiub.unibe.ch/

servers:
  - id: code_https
    name: AIUB CODE Products HTTPS
    hostname: "https://www.aiub.unibe.ch/download"
    protocol: https
    auth_required: false
    listing_url: "https://code.aiub.unibe.ch/s3_script/aiub_s3_bucket_listing.php?path={directory}"
    description: >
      CODE product downloads at the University of Bern. Directory listings
      are provided by AIUB's S3-backed product browser; FTP is retired.

products:
  # ── Orbits ──────────────────────────────────────────────────────
  - id: code_orbit_final
    product_name: ORBIT
    server_id: code_https
    available: true
    description: Archived CODE final precise orbits
    parameters:
      - {name: AAA, value: COD}
      - {name: TTT, value: FIN}
      - {name: PPP, value: OPS}
      - {name: PPP, value: MGX}
      - {name: SMP, value: 05M}
      - {name: SMP, value: 15M}
    directory: {pattern: "CODE/{YYYY}/"}

  - id: code_orbit_rapid
    product_name: ORBIT
    server_id: code_https
    available: true
    description: Current CODE rapid precise orbits
    parameters:
      - {name: AAA, value: COD}
      - {name: TTT, value: RAP}
      - {name: PPP, value: OPS}
      - {name: PPP, value: MGX}
      - {name: SMP, value: 05M}
      - {name: SMP, value: 15M}
    directory: {pattern: "CODE/"}

  # ── Clocks ──────────────────────────────────────────────────────
  - id: code_clock_final
    product_name: CLOCK
    server_id: code_https
    available: true
    description: Archived CODE final precise clocks
