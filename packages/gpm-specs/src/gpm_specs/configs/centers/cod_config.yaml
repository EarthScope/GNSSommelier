      - {name: TTT, value: FIN}
      - {name: PPP, value: OPS}
      - {name: SMP, value: 30S}
      - {name: SMP, value: 05M}
    directory: {pattern: "CODE/{YYYY}/"}

  - id: code_clock_rapid
